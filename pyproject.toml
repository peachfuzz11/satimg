[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satproducts"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "ph" }
]
dependencies = [
    "affine==2.4.0",
    "attrs==25.4.0",
    "certifi==2025.10.5",
    "click==8.3.0",
    "click-plugins==1.1.1.2",
    "cligj==0.7.2",
    "cloudpickle==3.1.1",
    "dask==2025.10.0",
    "fsspec==2025.9.0",
    "locket==1.0.0",
    "numpy==2.3.4",
    "packaging==25.0",
    "pandas==2.3.3",
    "partd==1.4.2",
    "pillow==12.0.0",
    "pyparsing==3.2.5",
    "pyproj==3.7.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "PyYAML==6.0.3",
    "rasterio==1.4.3",
    "rioxarray==0.19.0",
    "roaring-landmask==0.10.1",
    "six==1.17.0",
    "toolz==1.1.0",
    "tzdata==2025.2",
    "xarray==2025.10.1",
]

requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/peachfuzz11/satproducts"


