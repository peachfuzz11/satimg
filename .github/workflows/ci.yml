name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 13G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v --durations=15

      - name: Post-mortem (memory / OOM)
        if: always()
        run: |
          echo "=== free ==="; free -h
          echo "=== df ==="; df -h
          echo "=== dmesg: oom / segfault ==="
          sudo dmesg 2>/dev/null | grep -iE 'kill|oom|segfault|out of memory' | tail -50 || true
